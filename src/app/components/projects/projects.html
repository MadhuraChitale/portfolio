<section id="projects">
  <div class="container">
    <h2 class="title">Projects</h2>

    <div class="grid">
        @for (p of projects; track p.title) {
        <div class="card">
          <h3>{{ p.title }}</h3>
          <p>{{ p.desc }}</p>
          @if (p.github) {
            <a href="{{ p.github }}" target="_blank">GitHub →</a>
        }
    </div>
  }
</div>

  </div>
</section>
