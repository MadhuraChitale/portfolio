<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (() => {
      const savedTheme = (() => {
        try {
          return localStorage.getItem('theme');
        } catch {
          return null;
        }
      })();
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const useDarkTheme = savedTheme === 'dark' || (!savedTheme && prefersDark);

      if (!savedTheme) {
        try {
          localStorage.setItem('theme', useDarkTheme ? 'dark' : 'light');
        } catch {
        }
      }

      document.documentElement.classList.toggle('dark-theme', useDarkTheme);
      document.documentElement.style.colorScheme = useDarkTheme ? 'dark' : 'light';
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.toggle('dark-theme', useDarkTheme);
      });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
